__include__: [
  '../dfine/dfine_hgnetv2_m_coco.yml',
  '../base/rtv4.yml',
  '../dataset/custom_detection.yml'
]

output_dir: ./outputs/rtv4_hgnetv2_m_coco

use_wandb: True
wandb_project: DETR-PODPackage
wandb_run_name: rtv4_hgnetv2_m_custom


teacher_model:
  type: "DINOv3TeacherModel"
  dinov3_repo_path: dinov3/
  dinov3_weights_path: pretrain/dinov3_vitb16_pretrain_lvd1689m.pth
  patch_size: 16
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

HybridEncoder:
  distill_teacher_dim: 768

RTv4Criterion:
  weight_dict:
    loss_distill: 5
  distill_adaptive_params:
    enabled: True
    rho: 3.5
    delta: 0.25
    default_weight: 15

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001


epoches: 32

flat_epoch: 14
no_aug_epoch: 2

train_dataloader:
  total_batch_size: 32
  dataset:
    transforms:
      policy:
        epoch: [4, 14, 24]

  collate_fn:
    mixup_epochs: [4, 14]
    stop_epoch: 24
    copyblend_epochs: [24]
    base_size_repeat: 3